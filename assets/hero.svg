<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="t d">
  <title id="t">AAKASH.EXE: Aakash Munawar</title>
  <desc id="d">Aakash Munawar. Computer Science Student at Rutgers University. Full-Stack Development, AI, Data Science. Building practical software. Exploring intelligent systems. Always learning. HackRU 2026, Best Regeneron Entry Winner.</desc>
  <!-- AAKASH.EXE // hero module. If you're reading SVG source for fun, we should talk. -->
  <defs>
    <clipPath id="frame"><rect width="840" height="380" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#080D19"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.4" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="840" height="380" fill="url(#fade)"/></mask>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3B82F6" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pillClip"><rect x="48" y="318" width="398" height="34" rx="17"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .grid{animation:drift 7s linear infinite}
    @keyframes drift{to{transform:translate(28px,28px)}}
    .beam{animation:scan 8s linear infinite}
    @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(400px)}}
    .pulse{stroke-dasharray:7 93;animation:flow 4.5s linear infinite}
    .p2{animation-delay:-1.5s;animation-duration:5.5s}
    .p3{animation-delay:-3s;animation-duration:6s}
    .p4{animation-delay:-2.2s}
    @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    .dot{animation:rise 9s ease-in-out infinite}
    @keyframes rise{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-26px);opacity:.7}}
    .live{animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
    .spin,.spinR,.spinF{transform-box:fill-box;transform-origin:center}
    .spin{animation:rot 40s linear infinite}
    .spinR{animation:rot 26s linear infinite reverse}
    .spinF{animation:rot 9s linear infinite}
    @keyframes rot{to{transform:rotate(360deg)}}
    .orbit{transform-origin:700px 190px;animation:rot 14s linear infinite}
    .orbit2{transform-origin:700px 190px;animation:rot 22s linear infinite reverse}
    .core{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.08);opacity:1}}
    .bar{animation:slide 3.6s ease-in-out infinite}
    @keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(84px)}}
    .glint{animation:glint 6s ease-in-out infinite}
    @keyframes glint{0%,55%{transform:translateX(-140px)}85%,100%{transform:translateX(440px)}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="840" height="380" fill="url(#bg)"/>
    <g mask="url(#gridMask)"><rect class="grid" x="-28" y="-28" width="900" height="440" fill="url(#grid)"/></g>
    <circle cx="240" cy="170" r="260" fill="url(#glowBlue)"/>
    <circle cx="700" cy="190" r="190" fill="url(#glowViolet)"/>

    <!-- circuit traces -->
    <g fill="none" stroke-width="1.5" stroke-linecap="round">
      <g stroke="#1E3A5F">
        <path id="c1" d="M840 70H770L740 100H612"/>
        <path id="c2" d="M840 300H782L752 270H640"/>
        <path id="c3" d="M500 380V356L520 336H556"/>
        <path id="c4" d="M0 74H20L32 86V150"/>
      </g>
      <g stroke="#22D3EE">
        <path class="pulse" pathLength="100" d="M840 70H770L740 100H612"/>
        <path class="pulse p2" pathLength="100" d="M840 300H782L752 270H640"/>
        <path class="pulse p3" pathLength="100" d="M500 380V356L520 336H556"/>
        <path class="pulse p4" pathLength="100" d="M0 74H20L32 86V150"/>
      </g>
      <g fill="#0B1222" stroke="#22D3EE" stroke-opacity=".6">
        <circle cx="612" cy="100" r="3"/><circle cx="640" cy="270" r="3"/><circle cx="556" cy="336" r="3"/><circle cx="32" cy="150" r="3"/>
      </g>
    </g>

    <!-- particles -->
    <g fill="#22D3EE">
      <circle class="dot" cx="520" cy="80" r="1.6"/>
      <circle class="dot" cx="585" cy="200" r="1.2" style="animation-delay:-2s"/>
      <circle class="dot" cx="790" cy="150" r="1.5" style="animation-delay:-4s"/>
      <circle class="dot" cx="610" cy="350" r="1.3" style="animation-delay:-6s"/>
      <circle class="dot" cx="470" cy="300" r="1.1" style="animation-delay:-3s"/>
      <circle class="dot" cx="805" cy="330" r="1.4" style="animation-delay:-7s"/>
      <circle class="dot" cx="380" cy="40" r="1.2" style="animation-delay:-5s"/>
    </g>

    <rect class="beam" x="0" y="0" width="840" height="120" fill="url(#beam)"/>

    <!-- HUD corners -->
    <g fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.5">
      <path d="M16 36V16H36"/><path d="M804 16H824V36"/><path d="M824 344V364H804"/><path d="M36 364H16V344"/>
    </g>

    <!-- top status bar -->
    <g class="mono" font-size="11" letter-spacing="2">
      <rect x="48" y="30" width="9" height="9" rx="2" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="66" y="39" fill="#94A3B8">AAKASH.EXE</text>
      <text x="170" y="39" fill="#475569">// v26.10 · cs@rutgers</text>
      <circle class="live" cx="692" cy="35" r="4" fill="#22D3EE"/>
      <text x="704" y="39" fill="#22D3EE">SYSTEM ONLINE</text>
    </g>

    <!-- identity -->
    <text class="mono" x="48" y="112" font-size="13" fill="#22D3EE" letter-spacing="1">$ whoami</text>
    <text class="sans" x="46" y="166" font-size="50" font-weight="800" fill="#F8FAFC" letter-spacing="1">AAKASH MUNAWAR</text>
    <rect x="48" y="184" width="168" height="3" rx="1.5" fill="url(#spectrum)"/>
    <rect class="bar" x="48" y="184" width="84" height="3" rx="1.5" fill="#F8FAFC" fill-opacity=".55"/>
    <text class="sans" x="48" y="226" font-size="22" font-weight="600" fill="#E2E8F0">Computer Science Student @ Rutgers University</text>
    <text class="sans" x="48" y="260" font-size="18" font-weight="600" fill="url(#spectrum)" letter-spacing=".5">Full-Stack Development  •  AI  •  Data Science</text>
    <text class="sans" x="48" y="293" font-size="14.5" fill="#94A3B8">Building practical software. Exploring intelligent systems. Always learning.<tspan class="caret" fill="#22D3EE" dx="4">▍</tspan></text>

    <!-- award pill -->
    <rect x="48" y="318" width="398" height="34" rx="17" fill="#F59E0B" fill-opacity=".08" stroke="#F59E0B" stroke-opacity=".55"/>
    <g clip-path="url(#pillClip)"><rect class="glint" x="48" y="318" width="110" height="34" fill="url(#shine)"/></g>
    <g transform="translate(64 326)" fill="url(#gold)">
      <path d="M4 0h10v6.5a5 5 0 0 1-10 0z"/>
      <path d="M4 2H1.2a3.6 3.6 0 0 0 3.4 5.4M14 2h2.8a3.6 3.6 0 0 1-3.4 5.4" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
      <rect x="7.8" y="11" width="2.4" height="3.2"/><rect x="5" y="14.2" width="8" height="2.6" rx=".8"/>
    </g>
    <text class="mono" x="92" y="340" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="1">HACKRU 2026 — BEST REGENERON ENTRY WINNER</text>

    <!-- AI core -->
    <g fill="none">
      <circle class="spin" cx="700" cy="190" r="112" stroke="#94A3B8" stroke-opacity=".22" stroke-dasharray="1 7"/>
      <circle class="spinR" cx="700" cy="190" r="94" stroke="#3B82F6" stroke-opacity=".55" stroke-dasharray="14 6 2 6"/>
      <circle class="spinF" cx="700" cy="190" r="74" stroke="url(#spectrum)" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="22 11"/>
      <circle cx="700" cy="190" r="58" stroke="#22D3EE" stroke-opacity=".18"/>
    </g>
    <g class="orbit"><circle cx="700" cy="96" r="4" fill="#22D3EE"/></g>
    <g class="orbit2"><circle cx="700" cy="302" r="3" fill="#8B5CF6"/></g>
    <circle class="core" cx="700" cy="190" r="44" fill="#3B82F6" fill-opacity=".18"/>
    <path d="M700 152l33 19v38l-33 19-33-19v-38z" fill="#0B1222" stroke="url(#spectrum)" stroke-width="2"/>
    <text class="mono" x="700" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">&lt;/&gt;</text>
    <text class="mono" x="700" y="330" text-anchor="middle" font-size="10" fill="#64748B" letter-spacing="1">core.status = "learning"</text>
  </g>
  <rect x=".5" y=".5" width="839" height="379" rx="17.5" fill="none" stroke="#1E293B"/>
</svg>
