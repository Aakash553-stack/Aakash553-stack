<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-labelledby="t d">
  <title id="t">HackRU 2026 — Best Regeneron Entry Winner: Protocol Pre-Flight</title>
  <desc id="d">Award card. HackRU 2026, Best Regeneron Entry Winner. Protocol Pre-Flight: AI-powered clinical trial protocol analysis that flags missing sections, contradictions and patient burden, and routes findings to human review. Team: Yash Lalwani, Hanumath Mandadi, Aakash Munawar. Illustration: a protocol page being scanned while findings are flagged.</desc>
  <defs>
    <clipPath id="card"><rect width="840" height="300" rx="16"/></clipPath>
    <clipPath id="page"><rect x="640" y="34" width="166" height="232" rx="6"/></clipPath>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F59E0B" stop-opacity=".28"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".18"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".85" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".9"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="titleClip"><text x="256" y="98" font-size="30" font-weight="800" letter-spacing=".5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">BEST REGENERON ENTRY</text></clipPath>
    <path id="ring" d="M130 150m-70 0a70 70 0 1 1 140 0a70 70 0 1 1-140 0"/>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .rot,.rotR,.breathe{transform-box:fill-box;transform-origin:center}
    .rot{animation:rot 36s linear infinite}
    .rotR{animation:rot 18s linear infinite reverse}
    @keyframes rot{to{transform:rotate(360deg)}}
    .breathe{animation:breathe 4s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.06);opacity:1}}
    .glint{animation:glint 5s ease-in-out infinite}
    @keyframes glint{0%,60%{transform:translateX(-60px)}90%,100%{transform:translateX(420px)}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-40px)}70%,100%{transform:translateY(232px)}}
    .f1{animation:f1 6s linear infinite}.f2{animation:f2 6s linear infinite}.f3{animation:f3 6s linear infinite}.f4{animation:f4 6s linear infinite}
    @keyframes f1{0%,16%{opacity:0}19%,96%{opacity:1}100%{opacity:0}}
    @keyframes f2{0%,30%{opacity:0}33%,96%{opacity:1}100%{opacity:0}}
    @keyframes f3{0%,45%{opacity:0}48%,96%{opacity:1}100%{opacity:0}}
    @keyframes f4{0%,60%{opacity:0}63%,96%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="300" fill="#0A0F1E"/>
    <circle cx="130" cy="150" r="150" fill="url(#halo)"/>
    <circle cx="720" cy="150" r="170" fill="url(#haloV)"/>
    <rect width="840" height="3" fill="url(#rim)"/>

    <!-- emblem -->
    <circle class="rot" cx="130" cy="150" r="96" fill="none" stroke="#F59E0B" stroke-opacity=".35" stroke-dasharray="2 6"/>
    <circle cx="130" cy="150" r="84" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <g class="rotR"><text class="mono" font-size="10.5" font-weight="700" fill="#FCD34D" letter-spacing="2.6"><textPath href="#ring">HACKRU 2026 • BEST REGENERON ENTRY • WINNER •</textPath></text></g>
    <circle class="breathe" cx="130" cy="150" r="50" fill="#F59E0B" fill-opacity=".16"/>
    <path d="M130 104l40 23v46l-40 23-40-23v-46z" fill="#0A0F1E" stroke="url(#gold)" stroke-width="2"/>
    <g transform="translate(106 124) scale(2.65)" fill="url(#gold)">
      <path d="M4 0h10v6.5a5 5 0 0 1-10 0z"/>
      <path d="M4 2H1.2a3.6 3.6 0 0 0 3.4 5.4M14 2h2.8a3.6 3.6 0 0 1-3.4 5.4" fill="none" stroke="#F59E0B" stroke-width="1.4"/>
      <rect x="7.8" y="11" width="2.4" height="3.2"/><rect x="5" y="14.2" width="8" height="2.6" rx=".8"/>
    </g>

    <!-- headline -->
    <text class="mono" x="258" y="58" font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="3">HACKRU 2026 · WINNER</text>
    <text class="sans" x="256" y="98" font-size="30" font-weight="800" fill="#F8FAFC" letter-spacing=".5">BEST REGENERON ENTRY</text>
    <g clip-path="url(#titleClip)">
      <rect class="glint" x="256" y="70" width="40" height="36" fill="url(#shine)" opacity=".55"/>
    </g>
    <rect x="258" y="118" width="340" height="1" fill="#1E293B"/>
    <text class="mono" x="258" y="152" font-size="18" font-weight="700" fill="#22D3EE" letter-spacing="2">PROTOCOL PRE-FLIGHT</text>
    <text class="sans" x="258" y="177" font-size="14.5" fill="#CBD5E1">AI-Powered Clinical Trial Protocol Analysis</text>

    <g class="mono" font-size="10.5" font-weight="600">
      <rect x="258" y="196" width="118" height="24" rx="12" fill="#F59E0B" fill-opacity=".1" stroke="#F59E0B" stroke-opacity=".5"/>
      <text x="317" y="212" text-anchor="middle" fill="#FCD34D">missing sections</text>
      <rect x="384" y="196" width="106" height="24" rx="12" fill="#8B5CF6" fill-opacity=".12" stroke="#8B5CF6" stroke-opacity=".6"/>
      <text x="437" y="212" text-anchor="middle" fill="#C4B5FD">contradictions</text>
      <rect x="498" y="196" width="106" height="24" rx="12" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".5"/>
      <text x="551" y="212" text-anchor="middle" fill="#67E8F9">patient burden</text>
    </g>
    <text class="mono" x="258" y="258" font-size="10.5" fill="#64748B" letter-spacing=".5">team ▸ Yash Lalwani · Hanumath Mandadi · Aakash Munawar</text>

    <!-- protocol page being scanned -->
    <rect x="640" y="34" width="166" height="232" rx="6" fill="#0F172A" stroke="#334155"/>
    <g clip-path="url(#page)">
      <rect x="640" y="34" width="166" height="22" fill="#111C33"/>
      <text class="mono" x="652" y="49" font-size="8" fill="#94A3B8" letter-spacing="1">PROTOCOL · v1.0</text>
      <g fill="#334155">
        <rect x="652" y="68" width="120" height="4" rx="2"/><rect x="652" y="80" width="140" height="4" rx="2"/>
        <rect x="652" y="92" width="96" height="4" rx="2"/><rect x="652" y="112" width="132" height="4" rx="2"/>
        <rect x="652" y="124" width="110" height="4" rx="2"/><rect x="652" y="136" width="140" height="4" rx="2"/>
        <rect x="652" y="156" width="80" height="4" rx="2"/><rect x="652" y="168" width="138" height="4" rx="2"/>
        <rect x="652" y="180" width="118" height="4" rx="2"/><rect x="652" y="200" width="128" height="4" rx="2"/>
        <rect x="652" y="212" width="100" height="4" rx="2"/><rect x="652" y="232" width="140" height="4" rx="2"/>
        <rect x="652" y="244" width="90" height="4" rx="2"/>
      </g>
      <g class="mono" font-size="7.5" font-weight="700" letter-spacing=".5">
        <g class="f1"><rect x="648" y="88" width="104" height="12" rx="2" fill="#F59E0B" fill-opacity=".22" stroke="#F59E0B" stroke-opacity=".7"/>
          <rect x="716" y="99" width="84" height="14" rx="7" fill="#F59E0B"/><text x="758" y="109" text-anchor="middle" fill="#0A0F1E">MISSING §</text></g>
        <g class="f2"><rect x="648" y="120" width="118" height="12" rx="2" fill="#8B5CF6" fill-opacity=".25" stroke="#8B5CF6" stroke-opacity=".8"/>
          <rect x="716" y="141" width="84" height="14" rx="7" fill="#8B5CF6"/><text x="758" y="151" text-anchor="middle" fill="#F8FAFC">CONFLICT</text></g>
        <g class="f3"><rect x="648" y="164" width="146" height="12" rx="2" fill="#22D3EE" fill-opacity=".16" stroke="#22D3EE" stroke-opacity=".7"/>
          <rect x="716" y="185" width="84" height="14" rx="7" fill="#22D3EE"/><text x="758" y="195" text-anchor="middle" fill="#0A0F1E">BURDEN ↑</text></g>
        <g class="f4"><rect x="648" y="208" width="108" height="12" rx="2" fill="#3B82F6" fill-opacity=".22" stroke="#3B82F6" stroke-opacity=".8"/>
          <rect x="716" y="219" width="84" height="14" rx="7" fill="#3B82F6"/><text x="758" y="229" text-anchor="middle" fill="#F8FAFC">REVIEW ✓</text></g>
      </g>
      <rect class="scan" x="640" y="34" width="166" height="40" fill="url(#beam)" transform="translate(0 232)"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="839" height="299" rx="15.5" fill="none" stroke="#F59E0B" stroke-opacity=".35"/>
</svg>
