<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">Schedule Builder: project card</title>
  <desc id="d">Schedule Builder, a Python backtracking search over real Rutgers course sections that finds every conflict-free schedule and ranks them by preference; up to 5.9 times faster than brute force on a 5-course search. Illustration: a search tree with pruned branches and valid schedules.</desc>
  <defs><clipPath id="clip"><rect width="840" height="200" rx="14"/></clipPath><radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".10"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.flow{stroke-dasharray:6 94;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.live{animation:live 2s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.p1,.p2{stroke-dasharray:100;animation:draw 6s ease-in-out infinite}.p2{animation-delay:-3s}@keyframes draw{0%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}.x{animation:live 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="840" height="200" fill="#0A0F1E"/>
    <circle cx="660" cy="100" r="230" fill="url(#halo)"/>
    <rect width="4" height="200" fill="#8B5CF6"/>
    <text class="mono" x="32" y="42" font-size="11" fill="#8B5CF6" font-weight="700" letter-spacing="2.5">04 · ALGORITHMS · BACKTRACKING</text>
    <text class="sans" x="31" y="80" font-size="27" fill="#F8FAFC" font-weight="800">Schedule Builder</text>
    <text class="sans" x="32" y="108" font-size="14.5" fill="#CBD5E1">Finds every conflict-free Rutgers class schedule,</text>
    <text class="sans" x="32" y="128" font-size="14.5" fill="#CBD5E1">then ranks them by the preferences you choose.</text>
    <text class="mono" x="32" y="172" font-size="25" fill="#8B5CF6" font-weight="800">5.9×</text>
    <text class="mono" x="106" y="159" font-size="11" fill="#94A3B8">faster than brute force</text>
    <text class="mono" x="106" y="174" font-size="11" fill="#64748B">on a 5-course search</text>
    <rect x="466" y="18" width="356" height="164" rx="10" fill="#0D1426" stroke="#1E293B"/>
    <text class="mono" x="480" y="36" font-size="9" fill="#64748B" letter-spacing="1.5">BACKTRACKING SEARCH · PRUNE ON CONFLICT</text>
    <circle class="live" cx="806" cy="33" r="3" fill="#8B5CF6"/>
    <text class="mono" x="484" y="54" font-size="8" fill="#64748B">start</text><text class="mono" x="484" y="94" font-size="8" fill="#64748B">198:112</text><text class="mono" x="484" y="134" font-size="8" fill="#64748B">198:205</text><path d="M650 50L560 90" stroke="#334155" stroke-width="1.5"/><path d="M650 50L650 90" stroke="#334155" stroke-width="1.5"/><path d="M650 50L740 90" stroke="#334155" stroke-width="1.5"/><path d="M560 90L530 130" stroke="#334155" stroke-width="1.5"/><path d="M560 90L590 130" stroke="#1E293B" stroke-width="1.5"/><path d="M650 90L620 130" stroke="#1E293B" stroke-width="1.5"/><path d="M650 90L680 130" stroke="#1E293B" stroke-width="1.5"/><path d="M740 90L710 130" stroke="#334155" stroke-width="1.5"/><path d="M740 90L770 130" stroke="#1E293B" stroke-width="1.5"/><path class="p1" pathLength="100" d="M650 50L560 90L530 130" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/><path class="p2" pathLength="100" d="M650 50L740 90L710 130" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/><circle cx="650" cy="50" r="6" fill="#0D1426" stroke="#8B5CF6" stroke-width="1.5"/><circle cx="560" cy="90" r="6" fill="#0D1426" stroke="#8B5CF6" stroke-width="1.5"/><circle cx="650" cy="90" r="6" fill="#0D1426" stroke="#8B5CF6" stroke-width="1.5"/><circle cx="740" cy="90" r="6" fill="#0D1426" stroke="#8B5CF6" stroke-width="1.5"/><circle cx="530" cy="130" r="8" fill="#8B5CF6"/><path d="M526.5 130l2.5 2.5 4.5-5" fill="none" stroke="#F8FAFC" stroke-width="1.6"/><circle cx="590" cy="130" r="7" fill="#0D1426" stroke="#475569" stroke-dasharray="2 2"/><path class="x" d="M587 127l6 6m0-6l-6 6" stroke="#F87171" stroke-width="1.5"/><circle cx="620" cy="130" r="7" fill="#0D1426" stroke="#475569" stroke-dasharray="2 2"/><path class="x" d="M617 127l6 6m0-6l-6 6" stroke="#F87171" stroke-width="1.5"/><circle cx="680" cy="130" r="7" fill="#0D1426" stroke="#475569" stroke-dasharray="2 2"/><path class="x" d="M677 127l6 6m0-6l-6 6" stroke="#F87171" stroke-width="1.5"/><circle cx="710" cy="130" r="8" fill="#8B5CF6"/><path d="M706.5 130l2.5 2.5 4.5-5" fill="none" stroke="#F8FAFC" stroke-width="1.6"/><circle cx="770" cy="130" r="7" fill="#0D1426" stroke="#475569" stroke-dasharray="2 2"/><path class="x" d="M767 127l6 6m0-6l-6 6" stroke="#F87171" stroke-width="1.5"/><text class="mono" x="530" y="158" font-size="8.5" fill="#C4B5FD" text-anchor="middle">✓ valid</text><text class="mono" x="710" y="158" font-size="8.5" fill="#C4B5FD" text-anchor="middle">✓ valid</text><text class="mono" x="484" y="174" font-size="8.5" fill="#F87171">✗ pruned on time conflict</text><text class="mono" x="806" y="174" font-size="8.5" fill="#64748B" text-anchor="end">then ranked by preference →</text></g>
  <rect x=".5" y=".5" width="839" height="199" rx="13.5" fill="none" stroke="#1E293B"/>
</svg>
