    <rect x="480" y="44" width="57" height="16" rx="8" fill="#111C33" stroke="#334155"/><text class="mono" x="508.7" y="55.5" font-size="8.5" fill="#94A3B8" text-anchor="middle">dates ▾</text><rect x="543.4" y="44" width="76" height="16" rx="8" fill="#111C33" stroke="#334155"/><text class="mono" x="581.4" y="55.5" font-size="8.5" fill="#94A3B8" text-anchor="middle">district ▾</text><rect x="625.4" y="44" width="76" height="16" rx="8" fill="#111C33" stroke="#334155"/><text class="mono" x="663.4" y="55.5" font-size="8.5" fill="#94A3B8" text-anchor="middle">category ▾</text><rect x="707.4" y="44" width="70" height="16" rx="8" fill="#111C33" stroke="#334155"/><text class="mono" x="742.3" y="55.5" font-size="8.5" fill="#94A3B8" text-anchor="middle">arrests ▾</text><path d="M492 164.5H806" stroke="#334155"/><rect class="b0" x="498" y="102" width="17" height="62" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b1" x="523" y="90" width="17" height="74" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b2" x="548" y="76" width="17" height="88" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b3" x="573" y="68" width="17" height="96" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b4" x="598" y="60" width="17" height="104" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b5" x="623" y="72" width="17" height="92" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b6" x="648" y="84" width="17" height="80" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b7" x="673" y="94" width="17" height="70" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b8" x="698" y="80" width="17" height="84" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b9" x="723" y="64" width="17" height="100" rx="2" fill="#3B82F6" fill-opacity="0.55"/><rect class="b10" x="748" y="52" width="17" height="112" rx="2" fill="#22D3EE" fill-opacity="0.95"/><rect class="b11" x="773" y="74" width="17" height="90" rx="2" fill="#3B82F6" fill-opacity="0.55"/></g>
  <rect x=".5" y=".5" width="839" height="199" rx="13.5" fill="none" stroke="#1E293B"/>
