<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">Chicago Crime Explorer: project card</title>
  <desc id="d">Chicago Crime Explorer, an interactive FastAPI and Chart.js dashboard over 478,089 Chicago Police Department incident reports in a normalized SQL schema, with six filterable analyses. Illustration: filter chips above an animated bar chart.</desc>
  <defs><clipPath id="clip"><rect width="840" height="200" rx="14"/></clipPath><radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3B82F6" stop-opacity=".10"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.flow{stroke-dasharray:6 94;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.live{animation:live 2s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.b0{transform-box:fill-box;transform-origin:bottom;animation:b0 9s ease-out infinite}@keyframes b0{0%,2.0%{transform:scaleY(.04)}11.0%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b1{transform-box:fill-box;transform-origin:bottom;animation:b1 9s ease-out infinite}@keyframes b1{0%,4.2%{transform:scaleY(.04)}13.2%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b2{transform-box:fill-box;transform-origin:bottom;animation:b2 9s ease-out infinite}@keyframes b2{0%,6.4%{transform:scaleY(.04)}15.4%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b3{transform-box:fill-box;transform-origin:bottom;animation:b3 9s ease-out infinite}@keyframes b3{0%,8.6%{transform:scaleY(.04)}17.6%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b4{transform-box:fill-box;transform-origin:bottom;animation:b4 9s ease-out infinite}@keyframes b4{0%,10.8%{transform:scaleY(.04)}19.8%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b5{transform-box:fill-box;transform-origin:bottom;animation:b5 9s ease-out infinite}@keyframes b5{0%,13.0%{transform:scaleY(.04)}22.0%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b6{transform-box:fill-box;transform-origin:bottom;animation:b6 9s ease-out infinite}@keyframes b6{0%,15.2%{transform:scaleY(.04)}24.2%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b7{transform-box:fill-box;transform-origin:bottom;animation:b7 9s ease-out infinite}@keyframes b7{0%,17.4%{transform:scaleY(.04)}26.4%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b8{transform-box:fill-box;transform-origin:bottom;animation:b8 9s ease-out infinite}@keyframes b8{0%,19.6%{transform:scaleY(.04)}28.6%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b9{transform-box:fill-box;transform-origin:bottom;animation:b9 9s ease-out infinite}@keyframes b9{0%,21.8%{transform:scaleY(.04)}30.8%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b10{transform-box:fill-box;transform-origin:bottom;animation:b10 9s ease-out infinite}@keyframes b10{0%,24.0%{transform:scaleY(.04)}33.0%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}.b11{transform-box:fill-box;transform-origin:bottom;animation:b11 9s ease-out infinite}@keyframes b11{0%,26.2%{transform:scaleY(.04)}35.2%,94%{transform:scaleY(1)}100%{transform:scaleY(.04)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="840" height="200" fill="#0A0F1E"/>
    <circle cx="660" cy="100" r="230" fill="url(#halo)"/>
    <rect width="4" height="200" fill="#3B82F6"/>
    <text class="mono" x="32" y="42" font-size="11" fill="#3B82F6" font-weight="700" letter-spacing="2.5">03 · DATA · SQL · VISUALIZATION</text>
    <text class="sans" x="31" y="80" font-size="27" fill="#F8FAFC" font-weight="800">Chicago Crime Explorer</text>
    <text class="sans" x="32" y="108" font-size="14.5" fill="#CBD5E1">Interactive dashboard over two years of Chicago</text>
    <text class="sans" x="32" y="128" font-size="14.5" fill="#CBD5E1">Police Department incident reports.</text>
    <text class="mono" x="32" y="172" font-size="25" fill="#3B82F6" font-weight="800">478,089</text>
    <text class="mono" x="151" y="159" font-size="11" fill="#94A3B8">incidents in a normalized</text>
    <text class="mono" x="151" y="174" font-size="11" fill="#64748B">SQL schema · 6 analyses</text>
