<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">Study Group Matcher: project card</title>
  <desc id="d">Study Group Matcher, a full-stack Java and Spring Boot app that matches Rutgers students into study groups by shared courses and overlapping free time. 41 JUnit tests; the matcher is checked against a brute-force model. Illustration: two weekly availability grids overlapping, forming a group.</desc>
  <defs><clipPath id="clip"><rect width="840" height="200" rx="14"/></clipPath><radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.flow{stroke-dasharray:6 94;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.live{animation:live 2s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.ov{animation:ov 3s ease-in-out infinite}@keyframes ov{50%{fill-opacity:.35}}.pulse{transform-box:fill-box;transform-origin:center;animation:pl 3s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
