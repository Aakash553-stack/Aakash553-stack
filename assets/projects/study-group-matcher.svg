    <text class="sans" x="31" y="80" font-size="27" fill="#F8FAFC" font-weight="800">Study Group Matcher</text>
    <text class="sans" x="32" y="108" font-size="14.5" fill="#CBD5E1">Matches Rutgers students into study groups by</text>
    <text class="sans" x="32" y="128" font-size="14.5" fill="#CBD5E1">shared courses and overlapping weekly free time.</text>
    <text class="mono" x="32" y="172" font-size="25" fill="#22D3EE" font-weight="800">41</text>
