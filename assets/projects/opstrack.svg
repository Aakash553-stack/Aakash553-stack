  <title id="t">OpsTrack: project card</title>
  <desc id="d">OpsTrack, an in-progress operations management platform on fictional data: a 13-table 3NF PostgreSQL schema, Alembic migrations and a FastAPI REST layer are done (phases 1 to 4 of 10); authentication and the React frontend are next.</desc>
