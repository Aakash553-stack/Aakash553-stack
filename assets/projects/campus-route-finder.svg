<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-labelledby="t d">
  <title id="t">Campus Route Finder: project card</title>
  <desc id="d">Campus Route Finder, a Python command-line pathfinder using Dijkstra&#x27;s algorithm with a hand-built binary-heap priority queue over 24 real Rutgers campus locations from OpenStreetMap. Illustration: a schematic campus graph with the shortest route from Scott Hall across the Raritan River to Hill Center.</desc>
  <defs><clipPath id="clip"><rect width="840" height="200" rx="14"/></clipPath><radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".10"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.flow{stroke-dasharray:6 94;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.live{animation:live 2s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.route{stroke-dasharray:100;animation:draw 7s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:100}45%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}.flow{stroke-dasharray:3 97;animation-duration:3.5s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)">
    <rect width="840" height="200" fill="#0A0F1E"/>
    <circle cx="660" cy="100" r="230" fill="url(#halo)"/>
    <rect width="4" height="200" fill="#22D3EE"/>
    <text class="mono" x="32" y="42" font-size="11" fill="#22D3EE" font-weight="700" letter-spacing="2.5">05 · GRAPHS · DIJKSTRA</text>
    <text class="sans" x="31" y="80" font-size="27" fill="#F8FAFC" font-weight="800">Campus Route Finder</text>
    <text class="sans" x="32" y="108" font-size="14.5" fill="#CBD5E1">Shortest walking routes across Rutgers–New</text>
    <text class="sans" x="32" y="128" font-size="14.5" fill="#CBD5E1">Brunswick, from real OpenStreetMap coordinates.</text>
    <text class="mono" x="32" y="172" font-size="25" fill="#22D3EE" font-weight="800">24</text>
    <text class="mono" x="76" y="159" font-size="11" fill="#94A3B8">real campus locations</text>
    <text class="mono" x="76" y="174" font-size="11" fill="#64748B">hand-built binary-heap queue</text>
    <rect x="466" y="18" width="356" height="164" rx="10" fill="#0D1426" stroke="#1E293B"/>
    <text class="mono" x="480" y="36" font-size="9" fill="#64748B" letter-spacing="1.5">DIJKSTRA SHORTEST PATH (SCHEMATIC)</text>
    <circle class="live" cx="806" cy="33" r="3" fill="#22D3EE"/>
    <path d="M612 44C630 80 610 112 650 132S690 168 676 182" fill="none" stroke="#3B82F6" stroke-opacity=".25" stroke-width="10" stroke-linecap="round"/><text class="mono" x="676" y="176" font-size="7.5" fill="#3B82F6" fill-opacity=".8">Raritan River</text><path d="M500 150L540 112" stroke="#334155" stroke-width="1.3"/><path d="M500 150L586 152" stroke="#334155" stroke-width="1.3"/><path d="M540 112L560 66" stroke="#334155" stroke-width="1.3"/><path d="M540 112L640 102" stroke="#334155" stroke-width="1.3"/><path d="M586 152L650 160" stroke="#334155" stroke-width="1.3"/><path d="M586 152L640 102" stroke="#334155" stroke-width="1.3"/><path d="M560 66L640 102" stroke="#334155" stroke-width="1.3"/><path d="M640 102L700 70" stroke="#334155" stroke-width="1.3"/><path d="M640 102L712 140" stroke="#334155" stroke-width="1.3"/><path d="M650 160L712 140" stroke="#334155" stroke-width="1.3"/><path d="M700 70L790 56" stroke="#334155" stroke-width="1.3"/><path d="M700 70L760 108" stroke="#334155" stroke-width="1.3"/><path d="M712 140L760 108" stroke="#334155" stroke-width="1.3"/><path d="M760 108L790 56" stroke="#334155" stroke-width="1.3"/><path class="route" pathLength="100" d="M500 150L540 112L640 102L700 70L790 56" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="flow" pathLength="100" d="M500 150L540 112L640 102L700 70L790 56" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/><circle cx="500" cy="150" r="7" fill="#22D3EE"/><circle cx="500" cy="150" r="12" fill="none" stroke="#22D3EE" stroke-opacity=".4" class="live"/><circle cx="540" cy="112" r="4.5" fill="#0D1426" stroke="#67E8F9" stroke-width="1.5"/><circle cx="586" cy="152" r="4.5" fill="#0D1426" stroke="#475569" stroke-width="1.5"/><circle cx="560" cy="66" r="4.5" fill="#0D1426" stroke="#475569" stroke-width="1.5"/><rect x="634" y="96" width="12" height="12" rx="2" fill="#0D1426" stroke="#22D3EE" stroke-width="1.5" transform="rotate(45 640 102)"/><circle cx="700" cy="70" r="4.5" fill="#0D1426" stroke="#67E8F9" stroke-width="1.5"/><circle cx="712" cy="140" r="4.5" fill="#0D1426" stroke="#475569" stroke-width="1.5"/><circle cx="760" cy="108" r="4.5" fill="#0D1426" stroke="#475569" stroke-width="1.5"/><circle cx="790" cy="56" r="7" fill="#22D3EE"/><circle cx="790" cy="56" r="12" fill="none" stroke="#22D3EE" stroke-opacity=".4" class="live"/><circle cx="650" cy="160" r="4.5" fill="#0D1426" stroke="#475569" stroke-width="1.5"/><text class="mono" x="500" y="174" font-size="8" fill="#67E8F9" text-anchor="middle" font-weight="700">SCOTT HALL</text><text class="mono" x="790" y="80" font-size="8" fill="#67E8F9" text-anchor="middle" font-weight="700">HILL CENTER</text><text class="mono" x="640" y="90" font-size="7.5" fill="#64748B" text-anchor="middle">bridge</text></g>
  <rect x=".5" y=".5" width="839" height="199" rx="13.5" fill="none" stroke="#1E293B"/>
