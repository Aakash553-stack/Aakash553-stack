<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" role="img" aria-labelledby="t d">
  <title id="t">Protocol Pre-Flight: how it works</title>
  <desc id="d">Pipeline: 1 Parse a protocol PDF into a structured Protocol Graph. 2 Rule checks against ICH M11 and SPIRIT 2025 plus consistency rules. 3 AI review by four reviewer roles; every finding must quote text found on the page it cites. 4 Human review: accept or reject each finding. 5 Report: score, PDF, DOCX and USDM JSON exports. Confidential mode runs rule checks only.</desc>
  <defs><clipPath id="clip"><rect width="840" height="176" rx="14"/></clipPath></defs>
  <style>.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.flow{stroke-dasharray:6 94;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.live{animation:live 2s ease-in-out infinite}@keyframes live{50%{opacity:.25}}.s0{animation:s0 5s linear infinite}@keyframes s0{0%,4%{stroke-opacity:.25}8%{stroke-opacity:1}20%,100%{stroke-opacity:.25}}.s1{animation:s1 5s linear infinite}@keyframes s1{0%,20%{stroke-opacity:.25}24%{stroke-opacity:1}36%,100%{stroke-opacity:.25}}.s2{animation:s2 5s linear infinite}@keyframes s2{0%,36%{stroke-opacity:.25}40%{stroke-opacity:1}52%,100%{stroke-opacity:.25}}.s3{animation:s3 5s linear infinite}@keyframes s3{0%,52%{stroke-opacity:.25}56%{stroke-opacity:1}68%,100%{stroke-opacity:.25}}.s4{animation:s4 5s linear infinite}@keyframes s4{0%,68%{stroke-opacity:.25}72%{stroke-opacity:1}84%,100%{stroke-opacity:.25}}.pkt{animation:pkt 5s ease-in-out infinite}@keyframes pkt{0%{transform:translateX(0)}80%,100%{transform:translateX(636px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g clip-path="url(#clip)"><rect width="840" height="176" fill="#0A0F1E"/><text class="mono" x="32" y="34" font-size="11" fill="#F59E0B" font-weight="700" letter-spacing="2.5">01 · PROTOCOL PRE-FLIGHT · HOW IT WORKS</text><text class="mono" x="808" y="34" font-size="10" fill="#64748B" text-anchor="end">upload → review → verified findings</text><path d="M172 94H668" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="32" y="62" width="140" height="64" rx="10" fill="#0D1426" stroke="#1E293B"/><rect class="s0" x="32" y="62" width="140" height="64" rx="10" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity=".25"/><text class="mono" x="46" y="84" font-size="9" fill="#22D3EE" font-weight="700">01</text><text class="mono" x="66" y="84" font-size="10.5" fill="#F8FAFC" font-weight="700" letter-spacing="1">PARSE</text><text class="mono" x="46" y="103" font-size="9.5" fill="#94A3B8">PDF → structured</text><text class="mono" x="46" y="117" font-size="9.5" fill="#94A3B8">Protocol Graph</text><rect x="191" y="62" width="140" height="64" rx="10" fill="#0D1426" stroke="#1E293B"/><rect class="s1" x="191" y="62" width="140" height="64" rx="10" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity=".25"/><text class="mono" x="205" y="84" font-size="9" fill="#3B82F6" font-weight="700">02</text><text class="mono" x="225" y="84" font-size="10.5" fill="#F8FAFC" font-weight="700" letter-spacing="1">RULE CHECKS</text><text class="mono" x="205" y="103" font-size="9.5" fill="#94A3B8">ICH M11 · SPIRIT 2025</text><text class="mono" x="205" y="117" font-size="9.5" fill="#94A3B8">consistency rules</text><rect x="350" y="62" width="140" height="64" rx="10" fill="#0D1426" stroke="#1E293B"/><rect class="s2" x="350" y="62" width="140" height="64" rx="10" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity=".25"/><text class="mono" x="364" y="84" font-size="9" fill="#8B5CF6" font-weight="700">03</text><text class="mono" x="384" y="84" font-size="10.5" fill="#F8FAFC" font-weight="700" letter-spacing="1">AI REVIEW</text><text class="mono" x="364" y="103" font-size="9.5" fill="#94A3B8">4 reviewer roles,</text><text class="mono" x="364" y="117" font-size="9.5" fill="#94A3B8">quote-verified</text><rect x="509" y="62" width="140" height="64" rx="10" fill="#0D1426" stroke="#1E293B"/><rect class="s3" x="509" y="62" width="140" height="64" rx="10" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity=".25"/><text class="mono" x="523" y="84" font-size="9" fill="#F59E0B" font-weight="700">04</text><text class="mono" x="543" y="84" font-size="10.5" fill="#F8FAFC" font-weight="700" letter-spacing="1">HUMAN REVIEW</text><text class="mono" x="523" y="103" font-size="9.5" fill="#94A3B8">accept / reject</text><text class="mono" x="523" y="117" font-size="9.5" fill="#94A3B8">each finding</text><rect x="668" y="62" width="140" height="64" rx="10" fill="#0D1426" stroke="#1E293B"/><rect class="s4" x="668" y="62" width="140" height="64" rx="10" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity=".25"/><text class="mono" x="682" y="84" font-size="9" fill="#22D3EE" font-weight="700">05</text><text class="mono" x="702" y="84" font-size="10.5" fill="#F8FAFC" font-weight="700" letter-spacing="1">REPORT</text><text class="mono" x="682" y="103" font-size="9.5" fill="#94A3B8">score · PDF · DOCX</text><text class="mono" x="682" y="117" font-size="9.5" fill="#94A3B8">· USDM JSON</text><circle class="pkt" cx="102.0" cy="138" r="3.5" fill="#22D3EE"/><path d="M102.0 138H738.0" stroke="#1E293B" stroke-width="1"/><text class="mono" x="32" y="166" font-size="10" fill="#64748B">Confidential mode runs rule checks only, with no model calls. Every AI finding must quote text found on the page it cites.</text></g>
