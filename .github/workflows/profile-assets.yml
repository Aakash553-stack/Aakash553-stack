# Builds the README's live graphics (contribution snake + activity card) and publishes
# them to the `output` branch, so `main` never collects generated commits.
name: Profile assets

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/profile_stats.py

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161B22,#1E3A8A,#2563EB,#3B82F6,#22D3EE
            dist/snake-light.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EBEDF0,#C7D2FE,#93C5FD,#3B82F6,#1D4ED8

      - name: Generate activity card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/profile_stats.py dist/activity.svg

      - name: Publish to the output branch (only when something changed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git fetch --quiet --depth=1 origin output 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/prev"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/prev"
            if diff -rq "$RUNNER_TEMP/prev" dist >/dev/null; then
              echo "Assets unchanged; nothing to publish."
              exit 0
            fi
          fi
          cd dist
          git init --quiet
          git checkout --quiet -b output
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Update generated profile assets"
          git push --quiet --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
